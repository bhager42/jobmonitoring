# 15 days: one more than uv's 14-day exclude-newer window, so uv accepts every proposed version.
# The cooldowns delay routine version updates only. Security updates are not delayed; they
# need Dependabot alerts and security updates turned on in the repository settings.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 15 }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 15 }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 15 }

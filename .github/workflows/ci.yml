name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest --cov --cov-report=term-missing

  image:
    name: Docker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: jobmonitor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (UID 568, read-only root, healthcheck)
        run: |
          docker run -d --name jm --init --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -v jm-data:/data -p 8080:8080 jobmonitor:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' jm)
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker logs jm
          test "$status" = healthy
          test "$(docker exec jm id -u)" = 568
          curl -fsS http://127.0.0.1:8080/healthz | grep -q '"status":"ok"'

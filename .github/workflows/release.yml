name: Release

# Two ways to release; both run all of CI first, then publish both images, then create the
# GitHub release:
#   * push a tag:     git tag v1.2.3 && git push origin v1.2.3
#   * Actions tab:    Release > Run workflow > version "1.2.3" (creates the tag on that commit)
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.3. Must match app/__init__.py and have a CHANGELOG.md entry."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check the version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then version="${INPUT_VERSION#v}"; else version="${REF_NAME#v}"; fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$version' is not a version like 1.2.3 or 1.2.3-rc.1"; exit 1
          fi
          app_version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' app/__init__.py)
          if [ "$app_version" != "$version" ]; then
            echo "::error::app/__init__.py says $app_version, not $version"; exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' entry"; exit 1
          fi
          if [ "$EVENT" = "workflow_dispatch" ] && git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists; pushing it already started (or finished) its release"; exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  checks:
    needs: prepare
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish ${{ matrix.variant }} image
    needs: [prepare, checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - variant: full
            with_browser: "true"
            suffix: ""
          - variant: lite
            with_browser: "false"
            suffix: "-lite"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # 1.2.3 -> 1.2.3, 1.2, 1 and latest (plus -lite variants). Pre-releases such as
          # 1.3.0-rc.1 only get their exact version, never 1, 1.3 or latest.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.tag }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.prerelease == 'false' }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          labels: |
            org.opencontainers.image.title=Job Monitor${{ matrix.suffix }}
            org.opencontainers.image.description=Self-hosted job listing monitor for TrueNAS SCALE
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: WITH_BROWSER=${{ matrix.with_browser }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.variant }}

  github-release:
    name: GitHub release
    needs: [prepare, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the release (and its tag, for manual runs) from the CHANGELOG entry
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          # The lines after "## [<version>]" up to the next "## [" heading.
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<NOTES

          ### Images
          - \`ghcr.io/${GITHUB_REPOSITORY}:${VERSION}\` (with the browser)
          - \`ghcr.io/${GITHUB_REPOSITORY}:${VERSION}-lite\` (without)

          Install on TrueNAS SCALE with [docs/truenas-app.yaml](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/truenas-app.yaml); see the README.
          NOTES
          flags=(--title "Job Monitor ${VERSION}" --notes-file notes.md)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            flags+=(--verify-tag)
          else
            flags+=(--target "$GITHUB_SHA")   # manual run: tag the commit that was just tested
          fi
          gh release create "$TAG" "${flags[@]}"

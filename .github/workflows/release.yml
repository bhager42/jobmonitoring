name: Release

# Push a version tag (git tag v1.2.3 && git push origin v1.2.3) to publish images to GHCR.
# Everything in CI runs first, against both image variants.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish ${{ matrix.variant }} image
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - variant: full
            with_browser: "true"
            suffix: ""
          - variant: lite
            with_browser: "false"
            suffix: "-lite"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # v1.2.3 -> 1.2.3, 1.2, 1 and latest (plus -lite variants). Pre-releases such as
          # v1.3.0-rc.1 only get their exact version, never 1, 1.3 or latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          labels: |
            org.opencontainers.image.title=Job Monitor${{ matrix.suffix }}
            org.opencontainers.image.description=Self-hosted job listing monitor for TrueNAS SCALE
            org.opencontainers.image.licenses=AGPL-3.0-or-later
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          build-args: WITH_BROWSER=${{ matrix.with_browser }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.variant }}

  github-release:
    name: GitHub release notes
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the release from this version's CHANGELOG entry
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          # The lines after "## [<version>]" up to the next "## [" heading.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q . notes.md; then
            echo "No CHANGELOG.md entry for $version" >&2
            exit 1
          fi
          cat >> notes.md <<NOTES

          ### Images
          - \`ghcr.io/${GITHUB_REPOSITORY}:${version}\` (with the browser)
          - \`ghcr.io/${GITHUB_REPOSITORY}:${version}-lite\` (without)

          Install on TrueNAS SCALE with [docs/truenas-app.yaml](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/docs/truenas-app.yaml); see the README.
          NOTES
          prerelease=""
          if [[ "$TAG" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$TAG" --verify-tag --title "Job Monitor ${version}" --notes-file notes.md $prerelease

# Used only for developer commands such as:
#   DATA_DIR=./data uv run alembic revision --autogenerate -m "describe change"
# The app runs migrations programmatically (app/db/migrate.py).
[alembic]
script_location = %(here)s/app/db/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .

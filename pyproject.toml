[project]
name = "jobmonitor"
dynamic = ["version"]
description = "Self-hosted job listing monitor for TrueNAS SCALE"
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2.1.4",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "httpx[http2]>=0.28.1",
    "selectolax>=1.0.0",
    "regex>=2026.9.29",
    "apprise>=2.0.1",
    "cryptography>=50.0.2",
]

[project.scripts]
jobmonitor = "app.cli:main"

[project.optional-dependencies]
browser = [
    "playwright>=1.64.0",
]

[dependency-groups]
dev = [
    "httpx",
    "hypothesis>=6.169.2",
    "pyright",
    "pytest",
    "pytest-asyncio>=1.4.0",
    "pytest-cov",
    "respx>=0.23.1",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# Only resolve releases that are at least two weeks old. A rolling window (stored as a span in
# uv.lock, so `--locked` stays valid as time passes); Dependabot's cooldown is one day longer, so
# every version it proposes is already inside this window.
exclude-newer = "14 days"
# Security exceptions to the two-week rule. Each entry names the advisory; remove the entry once
# it is more than 14 days old (the rolling window then covers it).
#   certifi: GHSA-6q48-6c7w-9gw2 (compromised emSign intermediate CAs), fixed in 2026.10.18.
#   playwright: 1.64.0 bundles Node 24.21.0 (CVE-2026-111497, critical and on CISA's KEV list,
#     plus four high CVEs); 1.64.1 bundles the fixed Node 24.22.1.
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z", playwright = "2026-10-23T00:00:00Z" }

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PTH", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S310", "S311"]
# The E2E harness drives `docker`; "/tmp" there is the container's tmpfs mount.
"tests/e2e/**" = ["S101", "S105", "S106", "S108", "S310", "S311", "S603", "S607"]
"app/db/migrations/versions/**" = ["E501"]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
strict = ["app"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = ["e2e: end-to-end tests in a real browser (skipped without Chromium)"]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # Starlette's TestClient warns about httpx; revisit when Starlette documents the replacement.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[project]
name = "jobmonitor"
dynamic = ["version"]
description = "Self-hosted job listing monitor for TrueNAS SCALE"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "sqlalchemy[asyncio]>=2.1.4",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "httpx[http2]>=0.28.1",
    "selectolax>=1.0.0",
    "regex>=2026.9.29",
]

[project.scripts]
jobmonitor = "app.cli:main"

[project.optional-dependencies]
browser = [
    "playwright>=1.64.0",
]

[dependency-groups]
dev = [
    "httpx",
    "hypothesis>=6.169.2",
    "pyright",
    "pytest",
    "pytest-asyncio>=1.4.0",
    "pytest-cov",
    "respx>=0.23.1",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# Only resolve releases that are at least two weeks old. Move this date forward when updating dependencies.
exclude-newer = "2026-10-15T00:00:00Z"
# Security exceptions to the two-week rule. Each entry names the advisory; remove the entry once
# exclude-newer above moves past its date.
#   certifi: GHSA-6q48-6c7w-9gw2 (compromised emSign intermediate CAs), fixed in 2026.10.18.
exclude-newer-package = { certifi = "2026-10-21T00:00:00Z" }

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PTH", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"app/db/migrations/versions/**" = ["E501"]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
strict = ["app"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    # Starlette's TestClient warns about httpx; revisit when Starlette documents the replacement.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[project]
name = "jobmonitor"
dynamic = ["version"]
description = "Self-hosted job listing monitor for TrueNAS SCALE"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
]

[project.scripts]
jobmonitor = "app.cli:main"

[dependency-groups]
dev = [
    "httpx",
    "pyright",
    "pytest",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "app/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# Only resolve releases that are at least two weeks old. Move this date forward when updating dependencies.
exclude-newer = "2026-10-15T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
strict = ["app"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "error",
    # Starlette's TestClient warns about httpx; revisit when Starlette documents the replacement.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.coverage.run]
source = ["app"]

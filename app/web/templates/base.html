<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="same-origin">
  {% if csrf_token %}<meta name="csrf-token" content="{{ csrf_token }}">{% endif %}
  <title>{% block title %}Job Monitor{% endblock %} · Job Monitor</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}">
  <link rel="icon" href="{{ url_for('static', path='icon.svg') }}" type="image/svg+xml">
</head>
<body{% if csrf_token %} hx-headers='{{ {"X-CSRF-Token": csrf_token} | tojson }}'{% endif %}>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header">
    <a class="brand" href="/">Job Monitor</a>
    {% if authenticated %}
    <nav aria-label="Main">
      <ul>
        <li><a href="/" {% if request.url.path == "/" %}aria-current="page"{% endif %}>Dashboard</a></li>
        <li><a href="/settings" {% if request.url.path == "/settings" %}aria-current="page"{% endif %}>Settings</a></li>
        <li>
          <form method="post" action="/logout">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <button type="submit" class="link-button">Sign out</button>
          </form>
        </li>
      </ul>
    </nav>
    {% endif %}
  </header>
  <main id="main" tabindex="-1">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <p>Job Monitor {{ app_version }}</p>
  </footer>
</body>
</html>
